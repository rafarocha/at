name: Publicar GitHub Pages (pasta public/)

on:
  push:
    branches: [main]
    paths:
      - "html-mockups/**"
      - "scripts/**"
      - "public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Gerar public/ e teste-local/ a partir de html-mockups/ + scripts/dados/
        # CSV_URL_* vêm das "Variables" do repositório (Settings → Secrets and variables →
        # Actions → aba Variables) — é o que faz public/demo/ sair conectado à planilha real,
        # sem precisar commitar esses links no código. Veja html-howto/publicar.html.
        env:
          CSV_URL_CHECKPOINTS: ${{ vars.CSV_URL_CHECKPOINTS }}
          CSV_URL_OCORRENCIAS: ${{ vars.CSV_URL_OCORRENCIAS }}
          CSV_URL_RONDAS: ${{ vars.CSV_URL_RONDAS }}
        run: python3 scripts/build_public.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "public"
      - id: deployment
        uses: actions/deploy-pages@v4
